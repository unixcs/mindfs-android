# JVM arguments for the Gradle daemon. Sized for Compose + KSP on 8GB dev boxes.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official

android.useAndroidX=true
# Non-transitive R classes: faster builds; R classes only include resources declared in the module.
android.nonTransitiveRClass=true
